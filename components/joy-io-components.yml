generated: '2026-08-17'
method: searched
source: https://faq.joy.io/ (help center articles, fetched as .md)
note: >-
  Joy ships NO SDK and NO API, but it does publish a documented client-side embed surface: a hosted
  booking form ("formulaire de réservation" / "Widget de Réservation Intelligent") that a venue
  generates inside the Joy manager app and then embeds on its own website inside an iframe. This is
  the only first-party integration surface Joy documents for customers, alongside two channel
  buttons (Reserve with Google, social links) and a one-click reservation copy into Zenchef. There is
  no loader library, no JavaScript element API, no configuration options and no events — the embed is
  a single iframe with a per-establishment URL, so nothing here is programmable.
families:
- name: Booking form embed (formulaire de réservation)
  kind: hosted-iframe
  distribution: iframe
  loader_library: null
  configurable: false
  how_to_get: >-
    Joy manager app (https://app.joy.io/) -> Établissements -> Formulaires de réservation -> copy link
  embed_snippet_shape: >-
    <iframe src="<per-establishment booking form URL>" style="width: 100%; height: 100%;
    min-width: 320px; min-height: 680px; border: 0;"></iframe>
  published_dimensions:
    min_width: 320px
    min_height: 680px
  docs: https://faq.joy.io/booster-vos-réservations-via-vos-réseaux-sociaux/sms31VTaoPvoPrxvonNMnX/comment-faire-une-intégration-de-votre-formulaire-de-réservation-directement-sur-votre-site-internet-/1bNahfVsMK8aDqyJoHrU7C
  last_updated: '2023-07-19'
  note: >-
    requests submitted through the embed land directly in the venue's Joy inbox; the URL is
    per-establishment and is not published, so no example value is recorded here.
