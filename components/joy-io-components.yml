third_party_outbound:
- partner: Zenchef
  direction: joy -> zenchef
  mechanism: one-click "Copy to Zenchef" of a confirmed reservation
  docs: https://help.zenchef.com/hc/en-gb/articles/25136854612893-Joy-Privateaser
  note: >-
    Documented by Zenchef, not by Joy. Copy is one-way and one-shot; later edits on either side do
    not sync. Configured from the Zenchef partners tab using the Zenchef restaurantId.
- partner: Stripe
  direction: joy -> stripe
  mechanism: Stripe-backed deposits (cautions), prepayments and payment requests
  docs: https://faq.joy.io/caution-paiement-devis-et-facturation/noxjtcZsvatbmFFhoTgLF6
  note: venues connect an existing or new Stripe account to Joy; 1.6% bank commission per the pricing page
