note: >-
  Joy publishes three named tiers with a full feature-comparison matrix, but PUBLISHES NO PRICE for
  any of them: every tier's call to action is "En savoir plus" / "Demander une démo" and the page
  carries no figure in EUR for the subscription itself. Every `price` below is therefore null — a
  measured absence, not an omission. The only monetary figures Joy does publish on this page are the
  annual processed-revenue ceiling per tier, a 0% commission on reservations across all three tiers,
  and a 1.6% bank commission on Stripe-collected payments and deposits. These are self-serve SaaS
  subscriptions for hospitality venues, not API plans — Joy publishes no API and no API pricing.
