  reason: no-developer-program
  detail: >-
    Joy ships software only as an end-user product — a manager web/mobile app plus a hosted booking
    widget — and publishes no developer portal, API reference, OpenAPI, webhook catalogue or SDK; the
    private backend its own app calls, manager-api.privateaser.com (read from
    https://app.joy.io/config.js), returns HTTP 404 on /openapi.json and every other spec path and is
    gated by an AWS Cognito user pool, and the 90-article help-center index at faq.joy.io/llms.txt
    never uses the word "api".
