aid: joy-io
name: Joy (ex-Privateaser)
description: 'Joy is a French SaaS platform for bars, restaurants and venues that turns group and event
  enquiries into confirmed bookings. Founded in 2014 as Privateaser, the company now runs a two-sided
  business: privateaser.com, the group-venue marketplace that captures demand, and Joy, the manager-facing
  application (web plus iOS/Android) where an establishment centralises requests from Google, Instagram,
  its own website, WhatsApp and Privateaser, then works them through a unified calendar and messaging
  inbox, an SEO/GEO-optimised event showcase page, a virtual phone assistant, quotes, French-compliant
  invoicing, and Stripe-backed deposits and prepayments. Joy reports more than 3,000 partner establishments
  and over EUR100M in bookings managed in 2025. It publishes no public API, SDK, webhook catalogue or
  developer portal; the only integration surfaces it documents for customers are an embeddable iframe
  booking form, Reserve-with-Google, and a one-click reservation copy into Zenchef.'
